name: Release

on:
  create:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Build and tag images (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/honeypot-app:${{ github.ref_name }}

      - name: Build and tag exporter (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.exporter
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/honeypot-exporter:${{ github.ref_name }}

      - name: Upload release note artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: docs/DEPLOY.md
          asset_name: DEPLOY.md
          asset_content_type: text/markdown
